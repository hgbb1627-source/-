name: Update Competition Records

on:
  schedule:
    # 한국시간 09:00 ~ 24:00 (UTC 00:00 ~ 15:00) 동안 매 1시간마다(매시 정각) 자동 실행
    - cron: '0 0-15 * * *'
  workflow_dispatch: # GitHub 웹 콘솔에서 수동 'Run workflow' 지원

jobs:
  update-records:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl beautifulsoup4

      - name: Run Competition Auto Fetch
        run: |
          python auto_fetch_competition.py --save

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ README.md auto_fetch_competition.py
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto update admission records (GitHub Actions) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
